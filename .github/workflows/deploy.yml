name: Deploy Apply

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "Digite o nome do bucket"
        required: true
        default: "COLE AQUI O NOME DO SEU BUCKET"

env:
  TERRAFORM_VERSION: 1.7.5
  WORKING_DIR: infra
  PROJECT_ID: curso-iac-devops

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # 1. Autentica usando uma SA que tem acesso ao Secret Manager
      - name: Autenticar com GCP (para acessar Secret Manager)
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_ALUNO_02 }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Instalar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # 2. Recupera o JSON real da SA do Secret Manager
      - name: Recuperar Service Account do Secret Manager
        run: |
          gcloud secrets versions access latest \
            --secret=poc-service-account \
            --project=${{ env.PROJECT_ID }} > gcp-sa.json

      # 3. Autentica com a SA recuperada
      - name: Ativar Service Account
        run: |
          gcloud auth activate-service-account \
            --key-file=gcp-sa.json \
            --project=${{ env.PROJECT_ID }}

      - name: Inicializar Terraform
        run: terraform init
        working-directory: ${{ env.WORKING_DIR }}

      - name: Validar Terraform
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

      - name: Aplicar infraestrutura
        run: terraform apply -auto-approve -var="project_id=${{ env.PROJECT_ID }}"
        working-directory: ${{ env.WORKING_DIR }}

      - name: Copiar index.html para o bucket
        run: |
          echo "📁 Copiando index.html para o bucket..."
          gsutil cp "$GITHUB_WORKSPACE/calculadora/index.html" "gs://${{ github.event.inputs.bucket_name }}/index.html"
          echo "✅ HTML copiado com sucesso"

      - name: Exibir URL de acesso
        run: |
          echo "🚀 Deploy concluído!"
          echo "🌐 URL pública: https://${{ github.event.inputs.bucket_name }}.storage.googleapis.com/index.html"

      - name: Enviar notificação para o Discord
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"✅ Deploy concluído com sucesso!\\n🌐 URL: https://${{ github.event.inputs.bucket_name }}.storage.googleapis.com/index.html\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
